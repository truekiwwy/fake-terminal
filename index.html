<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fake Terminal - by truekiwwy</title>



  <script src="https://cdn.tailwindcss.com"></script>
  

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #050505;
    }

    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* les couleurs à personnaliser */
    .c-kw { color: #c084fc; }  /* type de variable */
    .c-var { color: #a78bfa; } /* nom de variable */
    .c-str { color: #86efac; } /* ton texte */
    .c-prop { color: #93c5fd; }/* tes objects */
    .c-fn { color: #fde68a; }  /* console.log */

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blink 1.5s step-end infinite;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen">

  <div class="glass rounded-xl overflow-hidden shadow-2xl max-w-2xl w-full mx-4" 
       style="font-family: 'JetBrains Mono', monospace; background: rgba(10, 10, 20, 0.4);">
    
    <!-- bouton + titre -->
    <div class="flex items-center justify-between px-4 py-3 bg-white/5 border-b border-white/5">
      <div class="flex items-center gap-3">
        <!-- bouton de fenêtre -->
        <div class="flex gap-1.5">
          <div class="w-3 h-3 rounded-xl bg-red-500/80"></div>
          <div class="w-3 h-3 rounded-xl bg-yellow-500/80"></div>
          <div class="w-3 h-3 rounded-xl bg-green-500/80"></div>
        </div>
        <!-- onglet du fichier -->
        <div class="flex items-center gap-1.5 px-3 py-1 rounded-md bg-white/5 border border-white/10">
          <span class="text-yellow-400 text-xs">JS</span>
          <span class="text-gray-400 text-xs">developer.js</span>
        </div>
      </div>
      <div class="flex gap-3 text-gray-600 text-xs">
        <span>—</span><span>⬜</span><span>✕</span>
      </div>
    </div>

    <!-- contenu du Code -->
    <div class="p-5 text-sm leading-7 text-gray-300 overflow-x-auto">
      <div class="flex gap-4">
        <span class="text-gray-700 select-none w-4 text-right flex-shrink-0">1</span>
        <span><span class="c-kw">const</span> <span class="c-var">developer</span> = {</span>
      </div>
      
      <div class="flex gap-4">
        <span class="text-gray-700 select-none w-4 text-right flex-shrink-0">2</span>
        <span>&nbsp;&nbsp;<span class="c-prop">name</span>: <span class="c-str">'truekiwwy_'</span>,</span>
      </div>
      
      <div class="flex gap-4">
        <span class="text-gray-700 select-none w-4 text-right flex-shrink-0">3</span>
        <span>
          &nbsp;&nbsp;<span class="c-prop">role</span>:&nbsp;
          <span class="c-str"> '<span id="typewriter"></span>'</span><span class="cursor c-str">|</span>,
        </span>
      </div>
      
      <div class="flex gap-4">
        <span class="text-gray-700 select-none w-4 text-right flex-shrink-0">4</span>
        <span>&nbsp;&nbsp;<span class="c-prop">languages</span>: [<span class="c-str">'JS'</span>, <span class="c-str">'Python'</span>, <span class="c-str">'HTML'</span>, <span class="c-str">'CSS'</span>]</span>
      </div>
      
      <div class="flex gap-4">
        <span class="text-gray-700 select-none w-4 text-right flex-shrink-0">5</span>
        <span>};</span>
      </div>
      
      <div class="flex gap-4">
        <span class="text-gray-700 select-none w-4 text-right flex-shrink-0">6</span>
        <span></span>
      </div>
      
      <div class="flex gap-4">
        <span class="text-gray-700 select-none w-4 text-right flex-shrink-0">7</span>
        <span><span class="c-fn">console</span>.<span class="c-fn">log</span>(<span class="c-str">developer</span>);</span>
      </div>
    </div>

    <div class="flex items-center justify-between px-4 py-2 bg-blue-500/10 border-t border-white/5 text-xs text-gray-500">
      <span class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-xl bg-emerald-400"></span> Node.js 20
      </span>
      <span>UTF-8</span>
      <span>JavaScript</span>
    </div>
  </div>



  <script>
    // liste des mots à faire défiler
    const ROLES = [
      "Discord bot creator",
      "Network Engineer",
      "Fullstack Dev"
    ];

    let roleIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typewriterElement = document.getElementById("typewriter");

    // (typing effect)

    function typeEffect() {
      const currentRole = ROLES[roleIndex];
      
      if (isDeleting) {
        // effacement du texte (plus rapide)
        typewriterElement.textContent = currentRole.substring(0, charIndex - 1);
        charIndex--;
      } else {
        // écriture du texte (vitesse normale)
        typewriterElement.textContent = currentRole.substring(0, charIndex + 1);
        charIndex++;
      }

      // vitesse d'écriture et d'effacement
      let typingSpeed = isDeleting ? 70 : 130;

      // logique pour passer au mot suivant
      if (!isDeleting && charIndex === currentRole.length) {
        typingSpeed = 2200; 
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        roleIndex = (roleIndex + 1) % ROLES.length; // Passe au rôle suivant
        typingSpeed = 500;
      }

      setTimeout(typeEffect, typingSpeed);
    }

    window.onload = () => {
      setTimeout(typeEffect, 1000);
    };
  </script>
</body>
</html>
